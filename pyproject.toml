[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpm-yilgarn"
version = "1.0.0"
description = "Mineral Prospectivity Mapping — Orogenic Gold, Yilgarn Craton pilot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Geospatials Team" }]

dependencies = [
    # --- Geospatial core ---
    "rasterio>=1.3.9",
    "geopandas>=0.14.3",
    "pyogrio>=0.7.0",
    "pyproj>=3.6.1",
    "shapely>=2.0.3",
    "xarray>=2024.1.0",

    # --- Numerical ---
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "scikit-image>=0.22.0",
    "affine>=2.4.0",

    # --- ML ---
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.3",
    "shap>=0.44.1",
    "torch>=2.2.0",

    # --- Data management ---
    "pandas>=2.2.0",
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.1",
    "joblib>=1.3.2",

    # --- Download / IO ---
    "requests>=2.31.0",
    "tqdm>=4.66.2",

    # --- Visualisation (optional but recommended) ---
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "contextily>=1.5.0",      # basemaps for target map display
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "ipykernel>=6.29.0",
    "jupyterlab>=4.1.0",
]
gpu = [
    # Install separately via: pip install torch --index-url https://download.pytorch.org/whl/cu121
]

[project.scripts]
run-pilot = "scripts.run_pilot:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -v"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true
